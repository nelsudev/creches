name: Validar issue de revisão

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: startsWith(github.event.issue.title, '[Revisão]')
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validar payload
        id: validation
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node --input-type=module -e \
            "import { parseReviewIssue } from './scripts/decision/parse-issue.mjs'; parseReviewIssue(process.env.ISSUE_BODY);"

      - name: Marcar como pendente
        if: steps.validation.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "decisao:pendente"
          gh issue edit "$ISSUE_NUMBER" --remove-label "decisao:erro" || true

      - name: Marcar erro de validação
        if: steps.validation.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "decisao:pendente" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "decisao:erro"
          gh issue comment "$ISSUE_NUMBER" --body-file - <<'EOF'
          ## Estrutura inválida

          Corrige os campos `target_path`, `ficha_markdown` e `index_row`. A issue voltará automaticamente a `decisao:pendente` quando for editada e validada.
          EOF
